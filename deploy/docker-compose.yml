version: "3.9"

services:
  # ===== 基础设施 =====
  mysql:
    image: mysql:8.0
    container_name: im-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_DATABASE: im
    volumes:
      - mysql-data:/var/lib/mysql
      - ../im-server/migrations:/docker-entrypoint-initdb.d   # 首次启动自动建表
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: im-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: im-mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: im-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Go 后端 =====
  api:
    build: ../im-server
    container_name: im-api
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"

  gateway:
    build:
      context: ../im-server
      dockerfile: Dockerfile.gateway
    container_name: im-gateway
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "9090:9090"

  # ===== Vue 前端 =====
  web:
    image: nginx:alpine
    container_name: im-web
    volumes:
      - ../im-web/dist:/usr/share/nginx/html:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on: [api, gateway]

  admin:
    image: nginx:alpine
    container_name: im-admin
    volumes:
      - ../im-web/dist:/usr/share/nginx/html:ro
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on: [api]

  # Flutter H5（移动端编译为 Web 的产物，API/WS 同源反代）
  h5:
    image: nginx:alpine
    container_name: im-h5
    volumes:
      - ../im-app/build/web:/usr/share/nginx/html:ro
      - ./nginx-h5.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"

  # PC 网页版（im-pc，青鸟 IM PC 壳适配当前后端）
  pc:
    image: nginx:alpine
    container_name: im-pc
    volumes:
      - ../im-pc/dist:/usr/share/nginx/html:ro
      - ./nginx-pc.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    depends_on: [api]

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  minio-data:
