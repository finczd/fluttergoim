# Flutter H5 静态托管 + 同源 API/WS 反代
# Flutter 编译时用 --dart-define=API_BASE_URL=/api --dart-define=WS_BASE_URL=/ws
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # REST API 反代（同源，无 CORS）—— 前缀匹配，无尾斜杠
    location /api {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # WebSocket 反代（同源）
    location /ws {
        proxy_pass http://gateway:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 路由（Flutter Web 单页应用）—— 放最后兜底，try_files 返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
