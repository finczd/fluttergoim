# im-project 单域名部署（一个域名分路径访问所有服务）
# 用法：宝塔 → 网站 → 你的站点 → 配置文件，把整个 server 块内容替换进去
#       （SSL 证书部署后宝塔会自动往这个 server 里加 443 段，不用手动写）
# 端口约定：api=8080  gateway=9090  MinIO(S3 API)=19000  前端=im-web/dist
# 域名假设：把下面的 your-domain.com 换成你的真实域名

server {
    listen 80;
    server_name your-domain.com;

    # 禁止敏感文件
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    # SSL 证书验证目录（宝塔自动续签用）
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    # ========== 1. REST API 反代（用户 + 后台共用 8080） ==========
    # 注意：proxy_pass 末尾【不带】/ ，必须原样透传 /api/v1/... 完整路径
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ========== 2. WebSocket 反代（gateway 9090，路径 /ws） ==========
    location = /ws {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ========== 3. MinIO 图片反代（走 19000 S3 端口，/im-files/ 原样透传） ==========
    location ^~ /im-files/ {
        proxy_pass http://127.0.0.1:19000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # ========== 4. 前端（im-web/dist，工作台 + 后台同一份产物） ==========
    root /www/wwwroot/im-project/im-web/dist;
    index index.html;

    # 管理后台入口：/admin 重定向到 admin.html
    location = /admin {
        return 301 /admin.html;
    }

    # 后台内部路由（如果后台是 history 模式且以 /admin/ 开头，取消下面注释）
    # location ^~ /admin/ {
    #     try_files $uri $uri/ /admin.html;
    # }

    # SPA 路由（工作台）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
