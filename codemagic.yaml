# Codemagic CI 配置（放仓库根目录）
# 仓库是 monorepo，Flutter 工程在 im-app/ 子目录 —— 所有脚本都必须 working_directory: im-app
#
# 签名方式：手动上传证书（App Store Connect API Key 自动签名的写法见文末注释）
#   1. Codemagic 网页 → 应用设置 → Code signing → 上传：
#      - .p12 证书（含私钥）
#      - .mobileprovision 描述文件（Bundle ID 必须是 com.ioslgm.44108）
#   2. 描述文件类型决定导出方式：
#      - 企业证书(In-House) → method: enterprise
#      - 正式发布证书(ad-hoc) → method: ad-hoc（当前配置）
#      - 开发证书(development) → method: development
#   3. use-profiles 脚本会自动把上传的证书/描述文件挂到工程上

workflows:
  ios-ipa:
    name: iOS IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc          # 企业证书改 enterprise；上 TestFlight 改 app_store
        bundle_identifier: com.ioslgm.44108 # 与苹果描述文件一致
    scripts:
      - name: 拉取 Flutter 依赖
        working_directory: im-app
        script: flutter packages pub get
      - name: 挂载证书与描述文件
        script: xcode-project use-profiles
      - name: 生成导出配置并打包 IPA
        working_directory: im-app
        script: |
          cat > /tmp/exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --export-options-plist=/tmp/exportOptions.plist
    artifacts:
      - im-app/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - 3333774@qq.com
        notify:
          success: true
          failure: true

# —— 自动签名备选（App Store Connect API Key 方式，上 TestFlight/商店推荐）——
# environment 里改为：
#   ios_signing:
#     distribution_type: app_store
#     bundle_identifier: com.ioslgm.44108
# 并在 Codemagic → Teams → Developer accounts 绑定 API Key，删掉 use-profiles 手动挂载步骤
# 的依赖也可（Codemagic 会自动取证书）；导出配置 method 改 app-store
